<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tela fictícia</title>
<!-- Telas ilustrativas com dados INVENTADOS. Nenhuma tela real de sistema interno. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  #root { height: 800px; }
  body { width: 1280px; height: 800px; overflow: hidden; font: 15px/1.4 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  .app { display: grid; grid-template-columns: 220px 1fr; height: 100%; }
  aside { background: var(--side); padding: 22px 16px; display: grid; align-content: start; gap: 6px; }
  .logo { font-weight: 800; font-size: 18px; margin-bottom: 18px; color: var(--accent); }
  .nav { padding: 9px 12px; border-radius: 8px; color: var(--muted); }
  .nav.on { background: var(--accentSoft); color: var(--fg); font-weight: 600; }
  main { padding: 26px 30px; display: grid; gap: 18px; align-content: start; overflow: hidden; }
  h1 { font-size: 24px; }
  .sub { color: var(--muted); margin-top: -12px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .card { background: var(--card); border-radius: 12px; padding: 18px 20px; border: 1px solid var(--line); }
  .kpi b { display: block; font-size: 26px; margin-top: 4px; }
  .kpi small { color: var(--muted); }
  .kpi i { font-style: normal; font-size: 12px; color: var(--good); }
  .row { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; }
  .bars { display: flex; align-items: flex-end; gap: 10px; height: 380px; padding-top: 14px; }
  .bars div { flex: 1; background: var(--accent); border-radius: 6px 6px 0 0; opacity: .85; }
  .bars div:nth-child(even) { opacity: .55; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-weight: 600; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  td { padding: 16px 6px; border-bottom: 1px solid var(--line); }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12px; background: var(--accentSoft); color: var(--accent); }
  .pill.warn { background: #f59e0b22; color: #d97706; }
  .pill.ok { background: #10b98122; color: #059669; }
  .list div { display: flex; justify-content: space-between; padding: 18px 0; border-bottom: 1px solid var(--line); }
  /* chat */
  .chat { display: grid; grid-template-columns: 260px 1fr; gap: 0; height: 100%; }
  .convs { border-right: 1px solid var(--line); padding: 18px 12px; display: grid; gap: 4px; align-content: start; }
  .conv { padding: 10px; border-radius: 8px; display: grid; gap: 2px; }
  .conv.on { background: var(--accentSoft); }
  .conv small { color: var(--muted); }
  .msgs { padding: 22px 28px; display: grid; gap: 14px; align-content: start; }
  .msg { max-width: 60%; padding: 10px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
  .msg.me { justify-self: end; background: var(--accent); color: white; border: 0; }
  .msg small { display: block; font-size: 12px; opacity: .7; margin-bottom: 2px; font-weight: 600; }
  .composer { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--muted); background: var(--card); }
  /* jogo */
  .game { height: 100%; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #3b1f5e, #120a1f); color: #fff; }
  .arena { display: grid; grid-template-columns: 1fr auto 1fr; gap: 60px; align-items: center; }
  .fighter { width: 180px; height: 220px; border-radius: 24px; display: grid; place-items: center; font-size: 80px; background: #ffffff10; border: 2px solid #ffffff30; }
  .hp { height: 12px; border-radius: 6px; background: #ffffff22; margin-top: 10px; overflow: hidden; }
  .hp div { height: 100%; background: #22c55e; }
  .combo { font-size: 30px; font-weight: 800; text-align: center; color: #fdba74; }
  .skills { display: flex; gap: 12px; margin-top: 40px; justify-content: center; }
  .skills span { width: 70px; height: 70px; border-radius: 16px; display: grid; place-items: center; font-size: 34px; background: #ffffff14; border: 2px solid #ffffff30; }
</style>
</head>

  root.innerHTML = `<div class="game" style="background:radial-gradient(circle at 50% 30%,#ffd6ec,#b9a7ff)"><div style="text-align:center;color:#4a2a6a"><div style="font-size:120px">🏡🎈🦋</div><div style="font-size:40px;font-weight:800;margin-top:10px">A Vila Mágica das Surpresas</div><div style="font-size:22px;margin-top:8px">Brincadeiras concluídas: 5 de 8 · 🎁 abra o presente nº 5!</div><div class="skills"><span style="background:#fff8">🎨</span><span style="background:#fff8">🔷</span><span style="background:#fff8">🎵</span><span style="background:#fff8">🌸</span></div></div></div>`
} else if (id === 'animacao-2d') {
  root.innerHTML = `<div class="game" style="background:#1d1d24"><div style="display:grid;grid-template-columns:repeat(3,320px);gap:18px">${['Cena 1 · banco', 'Cena 2 · terreiro', 'Cena 3 · caixa'].map((c, i) => `<div><div style="background:${['#f6c453', '#7cc4f2', '#f28a8a'][i]};height:200px;border:5px solid #111;border-radius:10px;display:grid;place-items:center;font-size:70px">${['😮', '🥁', '🛒'][i]}</div><div style="color:#ddd;margin-top:10px;font-size:18px">${c}</div></div>`).join('')}</div></div>`
} else {
  const s = S[id]
  theme(s.tema)
  const max = Math.max(...s.bars)
  const right = s.lista
    ? `<div class="card list"><b>Recentes</b>${s.lista.map(([a, b]) => `<div><span>${a}</span><small class="sub" style="margin:0">${b}</small></div>`).join('')}</div>`
    : `<div class="card"><b>Por mês</b><div class="bars">${s.bars.map((b) => `<div style="height:${(b / max) * 100}%"></div>`).join('')}</div></div>`
  const left = s.tabela
    ? `<div class="card"><table><tr>${s.tabela[0].map((h) => `<th>${h}</th>`).join('')}</tr>${s.tabela.slice(1).map((r) => `<tr>${r.map((c) => `<td>${pill(c)}</td>`).join('')}</tr>`).join('')}</table></div>`
    : `<div class="card"><b>Evolução</b><div class="bars">${s.bars.map((b) => `<div style="height:${(b / max) * 100}%"></div>`).join('')}</div></div>`
  root.innerHTML = `<div class="app"><aside><div class="logo">${s.app}</div>${s.menu.map((m, i) => `<div class="nav ${i === 1 ? 'on' : ''}">${m}</div>`).join('')}</aside>
  <main><h1>${s.titulo}</h1><p class="sub">${s.sub}</p>
  <div class="kpis">${s.kpis.map(([l, v, d]) => `<div class="card kpi"><small>${l}</small><b>${v}</b><i>${d}</i></div>`).join('')}</div>
  <div class="row">${left}${right}</div></main></div>`
}
</script>
</body>
</html>
